[project]
name = "yukichan-bot-v2"
version = "0.1.0"
description = "A NoneBot2 implementation of yukichan-bot."
readme = "CLAUDE.md"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi,httpx,websockets]>=2.5.0,<3",
    "nonebot-adapter-onebot>=2.4.0,<3",
    "nonebot-adapter-qq>=1.7.1,<2",
    "python-chess>=1.999",
    "cairosvg>=2.9.0",
    "pillow>=12.3.0",
    "imageio>=2.37.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
